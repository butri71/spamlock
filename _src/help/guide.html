{{crumbs}}
<div class="h-page">
  <article class="h-body">
    <div class="h-hero h-enter">
      <h1>{{title}}</h1>{{checked}}
    </div>
    <section class="h-answer" aria-label="{{answerLabel}}">
      <span class="h-answer-ic"><svg class="h-ic"><use href="#h-bolt"/></svg></span>
      <p>{{answer}}</p>
    </section>
    <section class="h-steps" aria-labelledby="steps">
      <h2 id="steps">{{stepsTitle}}</h2>
      <p class="h-muted">{{stepsIntro}}</p>
      <ol>
{{steps}}
      </ol>
    </section>
    {{related}}
  </article>
  {{appCard}}
</div>
