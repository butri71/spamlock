<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{pageTitle}}</title>
<meta name="description" content="{{pageDescription}}">
<link rel="canonical" href="https://spamlock.app{{pagePath}}">
{{alternates}}
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{pageTitle}}">
<meta property="og:description" content="{{pageDescription}}">
<meta property="og:url" content="https://spamlock.app{{pagePath}}">
<meta property="og:image" content="https://spamlock.app/assets/film/og-{{lang}}.jpg">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/suse.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/help.css">
{{jsonLd}}
</head>
<body class="help-page" data-page="{{pageId}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M11 18.5h2"/></symbol>
<symbol id="i-android" viewBox="0 0 24 24"><path d="M6 10.5h12v7a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2zM6.5 10.5a5.5 5.5 0 0 1 11 0M8.5 5.5 7 3.5M15.5 5.5 17 3.5M9.5 8h.1M14.5 8h.1"/></symbol>
<symbol id="h-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="h-out" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
<symbol id="h-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="h-tick" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="h-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></symbol>
<symbol id="h-scams" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.1A2.5 2.5 0 0 1 4 14.5zM12 7.5v4M12 14h.01"/></symbol>
<symbol id="h-accounts" viewBox="0 0 24 24"><path d="M8 15a4.5 4.5 0 1 1 0-.01M11.2 11.8l8.3-8.3M16 7l3 3"/></symbol>
<symbol id="h-phones" viewBox="0 0 24 24"><path d="M8.5 2.5h7a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2v-15a2 2 0 0 1 2-2zM11 18.5h2"/></symbol>
<symbol id="h-breaches" viewBox="0 0 24 24"><path d="M12 3 5 5.5v6c0 4.6 2.9 8 7 9.5 4.1-1.5 7-4.9 7-9.5v-6zM12 9v4M12 15.5h.01"/></symbol>
<symbol id="h-money" viewBox="0 0 24 24"><path d="M3 7.5A2 2 0 0 1 5 5.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 10h18"/></symbol>
<symbol id="h-whatif" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v5M12 16h.01"/></symbol>
<symbol id="h-news" viewBox="0 0 24 24"><path d="M5 4.5h11a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2zM18 9h1.5a1.5 1.5 0 0 1 1.5 1.5V18a1.5 1.5 0 0 1-3 0M8.5 8.5h6M8.5 12h6M8.5 15.5h3"/></symbol>
</defs></svg>
{{header}}
<main class="h-main{{mainClass}}">
{{content}}
</main>
<section class="wrap final" id="get"><div class="endp">
  <div>
    <p class="h-end-title">{{endTitle}}</p>
    <p class="lead">{{endLead}}</p>
    <div class="cta">{{storeButtons}}</div>
    <!--if:!android--><p class="soon"><svg class="ic"><use href="#i-android"/></svg>{{androidSoon}}</p><!--/if-->
  </div>
  <div class="duo" aria-hidden="true">
    <div class="phone p1"><img src="/assets/media/{{lang}}/result.webp" alt="" loading="lazy" width="600" height="1305"></div>
    <div class="phone p2"><img src="/assets/media/{{lang}}/home.webp" alt="" loading="lazy" width="600" height="1305"></div>
  </div>
</div></section>
{{footer}}
<script src="/assets/help.js" defer></script>
</body>
</html>
